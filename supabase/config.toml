project_id = "ktyzbrrbukpzrcokdmpu"

[api]
enabled = true
port = 54321
schemas = ["public", "auth"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[db.pooler]
enabled = false
port = 65432

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true

[auth]
enabled = true
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Email confirmation uses Supabase's built-in flow: signUp() sends a
# confirmation link (no custom code/table), the member clicks it, and
# Supabase redirects back with an active session. (Must also be turned ON
# in the Supabase dashboard: Auth > Providers > Email > "Confirm email" = ON.)
enable_confirmations = true

[edge_runtime]
enabled = true

[analytics]
enabled = true
port = 54327
